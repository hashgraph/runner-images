name: "ZXC: Retrieve Upstream Versions"
# This reusable component is called by the following workflows:
# - .github/workflows/flow-pull-request-checks.yaml
# - .github/workflows/flow-build-application.yaml

on:
  workflow_call:
    inputs:
      explicit-runner-version:
        description: "Runner Version:"
        type: string
        required: false
        default: ""
      explicit-hooks-version:
        description: "Container Hooks Version:"
        type: string
        required: false
        default: ""
      custom-job-label:
        description: "Custom Job Label"
        type: string
        required: false
        default: "Check"
    outputs:
      tag:
        description: "Tag Version"
        value: ${{ jobs.versions.outputs.tag-version }}
      runner:
        description: "Runner Version"
        value: ${{ jobs.versions.outputs.runner-version }}
      hooks:
        description: "Container Hooks Version"
        value: ${{ jobs.versions.outputs.hooks-version }}
      runner-sha256:
        description: "Runner linux-x64 Tarball SHA-256"
        value: ${{ jobs.versions.outputs.runner-sha256 }}
      hooks-sha256:
        description: "Container Hooks k8s Zip SHA-256"
        value: ${{ jobs.versions.outputs.hooks-sha256 }}

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  versions:
    name: ${{ inputs.custom-job-label || 'Check' }}
    runs-on: ubuntu-24.04
    outputs:
      tag-version: ${{ steps.tag.outputs.version }}
      runner-version: ${{ steps.runner.outputs.version }}
      hooks-version: ${{ steps.hooks.outputs.version }}
      runner-sha256: ${{ steps.checksums.outputs.runner-sha256 }}
      hooks-sha256: ${{ steps.checksums.outputs.hooks-sha256 }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@a90bcbc6539c36a85cdfeb73f7e2f433735f215b # v2.15.0
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install GH CLI
        uses: step-security/setup-gh-cli-action@7772f40c95d3e826fa1dca4844b9117a52493df5 # v3.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Authorize GH CLI
        run: echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Install JQ CLI
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            echo "::group::Updating APT Repository Indices"
              sudo apt update
            echo "::endgroup::"
            echo "::group::Installing JQ CLI"
              sudo apt install -y jq
            echo "::endgroup::"
          fi

      - name: Install SemVer CLI
        run: |
          echo "::group::Download SemVer Binary"
            sudo curl -L -o /usr/local/bin/semver https://raw.githubusercontent.com/fsaintjacques/semver-tool/master/src/semver
          echo "::endgroup::"
          echo "::group::Change SemVer Binary Permissions"
            sudo chmod -v +x /usr/local/bin/semver
          echo "::endgroup::"
          echo "::group::Show SemVer Binary Version Info"
            semver --version
          echo "::endgroup::"

      - name: Validate Explicit Runner Version
        id: explicit-runner
        if: ${{ inputs.explicit-runner-version != '' }}
        run: |
          VERSION="$(semver get release "${{ inputs.explicit-runner-version }}")"
          echo "version=${VERSION}" >>"${GITHUB_OUTPUT}"

      - name: Retrieve Runner Version
        id: runner
        run: |
          TARGET_TAG="v${{ steps.explicit-runner.outputs.version || '' }}"
          [[ "${TARGET_TAG}" == "v" ]] && TARGET_TAG=""
          LATEST_TAG="$(gh release view ${TARGET_TAG} -R actions/runner --json tagName | jq -r '.tagName')"
          VERSION="$(semver get release ${LATEST_TAG})"
          echo "version=${VERSION}" >>"${GITHUB_OUTPUT}"

      - name: Validate Explicit Hooks Version
        id: explicit-hooks
        if: ${{ inputs.explicit-hooks-version != '' }}
        run: |
          VERSION="$(semver get release "${{ inputs.explicit-hooks-version }}")"
          echo "version=${VERSION}" >>"${GITHUB_OUTPUT}"

      - name: Retrieve Runner Container Hooks Version
        id: hooks
        run: |
          TARGET_TAG="v${{ steps.explicit-hooks.outputs.version || '' }}"
          [[ "${TARGET_TAG}" == "v" ]] && TARGET_TAG=""
          LATEST_TAG="$(gh release view ${TARGET_TAG} -R actions/runner-container-hooks --json tagName | jq -r '.tagName')"
          VERSION="$(semver get release ${LATEST_TAG})"
          echo "version=${VERSION}" >>"${GITHUB_OUTPUT}"

      # The image build verifies the downloaded runner and hooks archives against these checksums. The runner's
      # checksum must agree in two places: GitHub's asset digest and the SHA its release pipeline writes into the
      # release notes. The hooks release only publishes the asset digest.
      - name: Retrieve Upstream Checksums
        id: checksums
        env:
          RUNNER_VERSION: ${{ steps.runner.outputs.version }}
          HOOKS_VERSION: ${{ steps.hooks.outputs.version }}
        run: |
          set -euo pipefail

          asset_sha256() {
            jq -r --arg asset "$2" '.assets[] | select(.name == $asset) | .digest // empty' <<<"$1" | sed 's/^sha256://'
          }

          require_sha256() {
            if [[ ! "$2" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error title=Upstream Checksum::Missing or malformed SHA-256 for $1: '$2'"
              exit 1
            fi
          }

          RUNNER_ASSET="actions-runner-linux-x64-${RUNNER_VERSION}.tar.gz"
          RUNNER_RELEASE="$(gh api "repos/actions/runner/releases/tags/v${RUNNER_VERSION}")"
          RUNNER_SHA256="$(asset_sha256 "${RUNNER_RELEASE}" "${RUNNER_ASSET}")"
          RUNNER_NOTES_SHA256="$(jq -r '.body' <<<"${RUNNER_RELEASE}" |
            sed -nE 's/.*<!-- BEGIN SHA linux-x64 -->([0-9a-f]{64})<!-- END SHA linux-x64 -->.*/\1/p' | head -n 1)"
          require_sha256 "${RUNNER_ASSET} (asset digest)" "${RUNNER_SHA256}"
          require_sha256 "${RUNNER_ASSET} (release notes)" "${RUNNER_NOTES_SHA256}"
          if [[ "${RUNNER_SHA256}" != "${RUNNER_NOTES_SHA256}" ]]; then
            echo "::error title=Upstream Checksum::${RUNNER_ASSET} asset digest ${RUNNER_SHA256} does not match the release notes SHA ${RUNNER_NOTES_SHA256}"
            exit 1
          fi

          HOOKS_ASSET="actions-runner-hooks-k8s-${HOOKS_VERSION}.zip"
          HOOKS_RELEASE="$(gh api "repos/actions/runner-container-hooks/releases/tags/v${HOOKS_VERSION}")"
          HOOKS_SHA256="$(asset_sha256 "${HOOKS_RELEASE}" "${HOOKS_ASSET}")"
          require_sha256 "${HOOKS_ASSET} (asset digest)" "${HOOKS_SHA256}"

          echo "${RUNNER_ASSET}: ${RUNNER_SHA256}"
          echo "${HOOKS_ASSET}: ${HOOKS_SHA256}"
          echo "runner-sha256=${RUNNER_SHA256}" >>"${GITHUB_OUTPUT}"
          echo "hooks-sha256=${HOOKS_SHA256}" >>"${GITHUB_OUTPUT}"

      - name: Tag Version Information
        id: tag
        run: |
          RELEASE="$(semver get release "${{ inputs.explicit-runner-version || steps.runner.outputs.version }}")"
          BUILD="$(semver get build "${{ inputs.explicit-runner-version || steps.runner.outputs.version }}")"

          VERSION="${RELEASE}"
          [[ -n "${BUILD}" ]] && VERSION="${VERSION}+${BUILD}"

          echo "version=${VERSION}" >>"${GITHUB_OUTPUT}"
